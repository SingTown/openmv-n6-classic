name: '📜 Check Commit Messages'

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    branches:    
      - 'master'

jobs:
  check-commit-messages:
    runs-on: ubuntu-24.04
    steps:
      - name: '📜 Check commit messages format'
        uses: gsactions/commit-message-checker@v2
        with:
          # Merge commits are accepted as they are: a merge of upstream brings in its
          # pull request merge commits, and those cannot be reworded.
          pattern: '^([^!]+: [A-Za-z]+.+ .+|Merge (pull request #[0-9]+ from|branch|remote-tracking branch|tag) .+)$'
          flags: 'gm'
          error: 'Commit subject line must match the following pattern: <scope>: <description>'
          excludeTitle: 'false'
          excludeDescription: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}
      - name: '📜 Check commit messages length'
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^[^#].{10,78}$'
          error: 'Commit subject line maximum line length of 78 characters is exceeded.'
          excludeTitle: 'false'
          excludeDescription: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}
